name: Freebuff HTTP Test

on:
  workflow_dispatch:

jobs:
  test-request:
    runs-on: ubuntu-latest

    steps:
      - name: GET freebuff.com
        shell: bash
        run: |
          set +e

          STATUS=$(curl -sS -o response.html -w "%{http_code}" \
            -X GET \
            'https://freebuff.com/' \
            -H 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7' \
            -H 'accept-language: he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7' \
            -H 'cache-control: no-cache' \
            -H 'pragma: no-cache' \
            -H 'upgrade-insecure-requests: 1')

          echo "HTTP status: $STATUS"
          echo "----- Response body (first 5000 bytes) -----"
          head -c 5000 response.html || true

          exit 0
