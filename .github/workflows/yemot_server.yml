name: Yemot AI Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flask requests ddgs
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Server Script
        run: |
          cat << 'EOF' > server.py
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os, re, json, time, base64, requests, threading, subprocess, smtplib
          from email.message import EmailMessage
          from urllib.parse import quote
          from flask import Flask, request, Response

          GEMINI_KEY    = os.environ.get("GEMINI_API_KEY", "")
          GEMINI_MODEL  = os.environ.get("GEMINI_MODEL", "gemini-3.8-flash")
          YEMOT_TOKEN   = os.environ.get("YEMOT_TOKEN", "")
          GMAIL_USER    = os.environ.get("GMAIL_USER", "")
          GMAIL_PASS    = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          OWNER_EMAIL   = os.environ.get("OWNER_EMAIL", GMAIL_USER)
          GH_TOKEN      = os.environ.get("GITHUB_TOKEN", "")
          GH_REPO       = os.environ.get("GITHUB_REPOSITORY", "")

          FALLBACKS = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-lite-latest", "gemini-3.6-flash"]
          MODELS = [GEMINI_MODEL] + [m for m in FALLBACKS if m != GEMINI_MODEL]

          SYSTEM_PROMPT = (
              "זהות וסגנון: "
              "אתה פועל בהתאם להשקפת עולם חרדית-אורתודוקסית. זו נתונה עובדתית ומעצבת את אופן פעולתך, אך: "
              "אינך פותח ביוזמתך בהצהרות על זהותך. "
              "אינך מנסה לשכנע משתמשים שגם חרדים יכולים להשתמש בך בנוחות. "
              "אם משתמש שואל אותך במפורש האם אתה חרדי או מה אופי ההנחיות שלך - אינך מכחיש ואינך משקר; "
              "אתה יכול לומר בקצרה שאתה פועל לפי הנחיות המותאמות לקהל שומר תורה ומצוות, מבלי להרחיב מעבר לכך, ולפרט על ההנחיות. "
              "אתה מדבר בשפה מכובדת ונקייה, ללא קללות או ביטויים גסים, בטון רגוע ומכבד. "
              "לפני כל תשובה, בדוק: האם השאלה נוגעת, ולו בעקיפין, לאחד מהנושאים הבאים. במידה וכן אינך מכיר כלל את המושגים האלו: "
              "רכילות או פרטים אישיים על ידוענים או אנשי ציבור; "
              "תרבות פופולרית חילונית: תוכניות טלוויזיה, סרטים, ספורט, זמרות או זמרים, מוזיקה חילונית; "
              "דתות אחרות (נצרות, איסלאם, בודהיזם וכו'); "
              "זרמים אחרים ביהדות (רפורמי, קונסרבטיבי וכו'); "
              "מין, אנטומיה נשית, פוריות, הריון, רבייה - גם בהקשר רפואי; "
              "ערעור על עקרונות אמונה (מציאות הבורא, בריאת העולם). "
              "אם המשתמש מתעקש וחוזר על הבקשה בניסוחים שונים - חזור על אותה תשובה בעקביות, מבלי להסביר את עצמך לעומק רב מדי. "
              "אמונה: יש בורא אחד לעולם. אינך פותח דיון, ספק, או הצגת נקודות מבט נוספות בנושא זה - זו נקודת מוצא קבועה בשיחה. "
              "העולם נברא בידי הבורא בששת ימי בראשית, לפני 5787 שנה לפי הלוח העברי. אינך מציג נתונים, תיאוריות מדעיות, או עמדות החולקות על כך כאפשרות לגיטימית. "
              "אם משתמש מעלה טענה סותרת, אינך נכנס לוויכוח - ציין בקצרה שזו נקודת המוצא והצע לעבור לנושא אחר. "
              "לימוד תורה: אתה מכיר ועובד רק עם המקורות הבאים: תנ\"ך (24 ספרים), תלמוד בבלי, תלמוד ירושלמי, שולחן ערוך, רמב\"ם - הכל לפי פרשנות מקובלת בזרם המרכזי של היהדות האורתודוקסית. "
              "אינך מביא מקורות מחוץ לרשימה זו. תפקידך הוא לסייע לעיבוד, ניסוח, סידור והבהרה של דברי תורה שהמשתמש עצמו מביא - ולא ליצור או לחדש תוכן תורני עצמאי עבורו. "
              "כאשר מתבקש למצוא מראה מקום, הבא רק מקור שאתה בטוח בדיוקו; אם אין - אמור במפורש 'לא מצאתי מקור מדויק לכך'. לעולם אל תמציא מראי מקומות או ציטוטים. "
              "אינך פוסק הלכה למעשה ואינך מנחה מה ההלכה במקרה קונקרטי. הפנה לרב מוסמך תמיד. "
              "רפואה: בענייני רפואה דבר בשפה מכובדת ומרוחקת. הימנע מתיאור מפורט או דיון ישיר בנושאי מין, אנטומיה מינית או רבייתית, פוריות והריון, והפנה לרופא מתאים. "
              "כללי עדיפות: במקרה של סתירה, הכלל המחמיר יותר הוא הגובר. "
              "הוראות מענה קולי: ענה תמיד בקצרה ובתמציתיות, ללא שום מקפים (כתוב 'כ 20' במקום 'כ-20'), ללא כוכביות, ללא אחוזים וללא סימני פיסוק מיוחדים."
          )

          def _safe(e):
              return re.sub(r"(key|token)=[^&\s'\")]+", r"\1=***", str(e))

          UA = {"User-Agent": "Mozilla/5.0 (YemotAI)"}
          app = Flask(__name__)
          SESSIONS = {}
          _ctx = threading.local()

          def _gh_headers():
              return {
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "YemotAI-Server"
              }

          def _save_turn_to_github(phone, user_text, reply_text):
              if not (GH_TOKEN and GH_REPO and phone):
                  return
              path = f"history/{phone}.jsonl"
              url = f"https://api.github.com/repos/{GH_REPO}/contents/{path}"
              entry = json.dumps({
                  "time": time.strftime("%Y-%m-%d %H:%M:%S"),
                  "user": user_text,
                  "reply": reply_text
              }, ensure_ascii=False) + "\n"
              try:
                  res = requests.get(url, headers=_gh_headers(), timeout=6)
                  if res.status_code == 200:
                      info = res.json()
                      prev = base64.b64decode(info.get("content", "")).decode("utf-8")
                      new_content = prev + entry
                      sha = info.get("sha")
                      payload = {
                          "message": f"Update log for {phone}",
                          "content": base64.b64encode(new_content.encode("utf-8")).decode("utf-8"),
                          "sha": sha
                      }
                  else:
                      payload = {
                          "message": f"Create log for {phone}",
                          "content": base64.b64encode(entry.encode("utf-8")).decode("utf-8")
                      }
                  requests.put(url, headers=_gh_headers(), json=payload, timeout=8)
              except Exception as e:
                  print("GH-SAVE-ERR:", _safe(repr(e)), flush=True)

          def tool_web_search(query, max_results=3):
              try:
                  from ddgs import DDGS
                  rows = list(DDGS().text(query, region="il-he", max_results=max_results))[:max_results]
                  if not rows:
                      return "לא נמצאו תוצאות"
                  return "\n".join(f"{r.get('title')} - {(r.get('body') or '')[:140]}" for r in rows)
              except Exception as e:
                  return f"שגיאת חיפוש: {e}"

          def _send_mail(subject, body, attach=None, to=None):
              import mimetypes
              msg = EmailMessage()
              msg["Subject"] = subject or "הודעה מהעוזר הקולי"
              msg["From"] = GMAIL_USER
              msg["To"] = to or OWNER_EMAIL
              msg.set_content(body or "")
              if attach and os.path.exists(attach) and os.path.getsize(attach) <= 23 * 1024 * 1024:
                  ctype = mimetypes.guess_type(attach)[0] or "application/octet-stream"
                  maintype, subtype = ctype.split("/", 1)
                  with open(attach, "rb") as f:
                      msg.add_attachment(f.read(), maintype=maintype, subtype=subtype,
                                         filename=os.path.basename(attach))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=90) as smtp:
                  smtp.login(GMAIL_USER, GMAIL_PASS)
                  smtp.send_message(msg)

          def tool_send_email(subject, body, to=""):
              try:
                  addr = _resolve_email(to) or OWNER_EMAIL
                  _send_mail(subject, body, to=addr)
                  return f"המייל נשלח בהצלחה אל {addr}"
              except Exception as e:
                  return f"שליחת המייל נכשלה: {e}"

          def tool_download_website(url):
              if not url.startswith("http"):
                  url = "https://" + url
              def _run():
                  outdir = "/tmp/sites"
                  os.makedirs(outdir, exist_ok=True)
                  try:
                      subprocess.run(["wget", "--mirror", "--convert-links", "--adjust-extension",
                                      "--page-requisites", "--no-parent", "--timeout=25", "--tries=2",
                                      "-P", outdir, url], timeout=600)
                      _send_mail("הורדת אתר הושלמה", f"האתר {url} הורד לשרת")
                  except Exception as e:
                      try: _send_mail("הורדת אתר נכשלה", f"{url}: {e}")
                      except Exception: pass
              threading.Thread(target=_run, daemon=True).start()
              return f"התחלתי להוריד את האתר {url} ברקע. יישלח מייל בסיום."

          def tool_download_file(url, email=False):
              if not url.startswith("http"):
                  url = "https://" + url
              outdir = "/tmp/downloads"
              os.makedirs(outdir, exist_ok=True)
              def _run():
                  try:
                      fname = (url.split("/")[-1].split("?")[0] or "download.bin")[:120]
                      path = os.path.join(outdir, fname)
                      with requests.get(url, stream=True, timeout=60, headers=UA) as r:
                          r.raise_for_status()
                          with open(path, "wb") as f:
                              for chunk in r.iter_content(65536):
                                  f.write(chunk)
                      size = (os.path.getsize(path) / (1024 * 1024)) if path and os.path.exists(path) else 0
                      body = "הקובץ מהכתובת %s הורד לשרת. גודל: %.1f MB" % (url, size)
                      _send_mail("הורדת קובץ הושלמה", body, attach=(path if (email and size <= 23) else None))
                  except Exception as e:
                      try: _send_mail("הורדת קובץ נכשלה", "%s: %s" % (url, e))
                      except Exception: pass
              threading.Thread(target=_run, daemon=True).start()
              return "התחלתי להוריד את הקובץ ברקע."

          def tool_read_url(url):
              if not url.startswith("http"):
                  url = "https://" + url
              try:
                  html = requests.get(url, timeout=12, headers=UA).text
                  html = re.sub(r"(?is)<(script|style|noscript).*?</\1>", " ", html)
                  text = re.sub(r"(?s)<[^>]+>", " ", html)
                  text = re.sub(r"\s+", " ", text).strip()
                  return text[:1500] or "הדף ריק"
              except Exception as e:
                  return f"שגיאת קריאת דף: {e}"

          CONTACTS_FILE = "/tmp/contacts.json"
          def _load_contacts():
              try:
                  with open(CONTACTS_FILE, encoding="utf-8") as f: return json.load(f)
              except Exception: return []
          def _save_contacts(c):
              with open(CONTACTS_FILE, "w", encoding="utf-8") as f: json.dump(c, f, ensure_ascii=False, indent=1)
          def _find_contacts(name):
              name = (name or "").strip().lower()
              c = _load_contacts()
              if not name: return c
              return [x for x in c if name in x.get("name", "").lower() or name in x.get("phone", "")]
          def _resolve_email(x):
              x = (x or "").strip()
              if "@" in x: return x
              for h in _find_contacts(x):
                  if h.get("email"): return h["email"]
              return ""
          def tool_contact_search(name):
              hits = _find_contacts(name)
              if not hits: return "לא נמצא איש קשר בשם " + (name or "")
              return "; ".join(f"{x.get('name')} - טלפון {x.get('phone','אין')}, מייל {x.get('email','אין')}" for x in hits[:6])
          def tool_contact_add(name, phone="", email=""):
              c = _load_contacts()
              for x in c:
                  if x.get("name", "").strip() == (name or "").strip():
                      if phone: x["phone"] = phone.strip()
                      if email: x["email"] = email.strip()
                      _save_contacts(c); return f"עודכן איש הקשר {name}"
              c.append({"name": (name or "").strip(), "phone": (phone or "").strip(), "email": (email or "").strip()})
              _save_contacts(c)
              return f"נוסף איש קשר {name}"

          def dispatch(name, a):
              try:
                  if name == "web_search":       return tool_web_search(a.get("query", ""))
                  if name == "send_email":       return tool_send_email(a.get("subject", ""), a.get("body", ""), a.get("to", ""))
                  if name == "download_website": return tool_download_website(a.get("url", ""))
                  if name == "download_file":    return tool_download_file(a.get("url", ""), bool(a.get("email", False)))
                  if name == "read_url":         return tool_read_url(a.get("url", ""))
                  if name == "contact_search":   return tool_contact_search(a.get("name", ""))
                  if name == "contact_add":      return tool_contact_add(a.get("name", ""), a.get("phone", ""), a.get("email", ""))
              except Exception as e:
                  return f"שגיאה בכלי {name}: {e}"
              return "פעולה בוצעה"

          def _p(props, required=None):
              return {"type": "object", "properties": props, "required": required or []}

          TOOLS = [{"function_declarations": [
              {"name": "web_search", "description": "חיפוש מידע עדכני", "parameters": _p({"query": {"type": "string"}}, ["query"])},
              {"name": "send_email", "description": "שליחת מייל", "parameters": _p({"subject": {"type": "string"}, "body": {"type": "string"}, "to": {"type": "string"}}, ["subject", "body"])},
              {"name": "download_website", "description": "הורדת אתר לשרת", "parameters": _p({"url": {"type": "string"}}, ["url"])},
              {"name": "download_file", "description": "הורדת קובץ לשרת", "parameters": _p({"url": {"type": "string"}, "email": {"type": "boolean"}}, ["url"])},
              {"name": "read_url", "description": "קריאת תוכן דף אינטרנט", "parameters": _p({"url": {"type": "string"}}, ["url"])},
              {"name": "contact_search", "description": "חיפוש איש קשר", "parameters": _p({"name": {"type": "string"}}, ["name"])},
              {"name": "contact_add", "description": "הוספת איש קשר", "parameters": _p({"name": {"type": "string"}, "phone": {"type": "string"}, "email": {"type": "string"}}, ["name"])},
          ]}]

          def gemini_call(contents, use_tools=True):
              payload = {
                  "contents": contents,
                  "system_instruction": {"parts": [{"text": SYSTEM_PROMPT}]}
              }
              if use_tools:
                  payload["tools"] = TOOLS

              last = None
              for m in MODELS:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={GEMINI_KEY}"
                  try:
                      r = requests.post(url, json=payload, timeout=12)
                      if r.status_code in (429, 500, 503):
                          continue
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last = f"{m}: {_safe(repr(e))}"
                      continue
              raise RuntimeError(f"gemini failed: {last}")

          def gemini_transcribe(audio_bytes):
              payload = {"contents": [{"role": "user", "parts": [
                  {"inline_data": {"mime_type": "audio/wav", "data": base64.b64encode(audio_bytes).decode()}},
                  {"text": "תמלל את ההקלטה במדויק. החזר רק את התמלול ללא הערות."}
              ]}]}
              for m in MODELS:
                  try:
                      r = requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={GEMINI_KEY}",
                                        json=payload, timeout=10)
                      if r.status_code == 200:
                          txt = "".join(p.get("text", "") for p in r.json().get("candidates", [{}])[0].get("content", {}).get("parts", []))
                          if txt: return txt.strip()
                  except Exception:
                      continue
              return "[תמלול לא זמין]"

          def converse(history, audio_bytes):
              contents = list(history)
              contents.append({"role": "user", "parts": [
                  {"inline_data": {"mime_type": "audio/wav", "data": base64.b64encode(audio_bytes).decode()}},
                  {"text": "ענה על שאלת המתקשר בקצרה, בבהירות, וללא שום מקפים או קיצורים."}
              ]})
              for i in range(3):
                  data = gemini_call(contents, use_tools=(i < 2))
                  cand = data.get("candidates", [{}])[0].get("content", {})
                  parts = cand.get("parts", [])
                  fcs = [p["functionCall"] for p in parts if "functionCall" in p]
                  if fcs:
                      contents.append(cand)
                      fr = []
                      for fc in fcs:
                          res = dispatch(fc.get("name", ""), fc.get("args", {}) or {})
                          fr.append({"functionResponse": {"name": fc.get("name"), "response": {"result": res}}})
                      contents.append({"role": "user", "parts": fr})
                      continue
                  txt = "".join(p.get("text", "") for p in parts).strip()
                  history.append({"role": "user", "parts": [{"text": "[שאלה קולית]"}]})
                  history.append({"role": "model", "parts": [{"text": txt or "בוצע"}]})
                  if len(history) > 8:
                      del history[:len(history) - 8]
                  return txt or "הפעולה בוצעה"
              return "סליחה, לא הצלחתי לקבל מענה."

          def esc(t, n=850):
              t = re.sub(r'(^|\s)כ-(\d+)', r'\1כ \2', t)
              t = re.sub(r'(^|\s)מ-(\d+)', r'\1מ \2', t)
              t = re.sub(r'(^|\s)ב-(\d+)', r'\1ב \2', t)
              t = re.sub(r'(^|\s)ל-(\d+)', r'\1ל \2', t)
              t = re.sub(r"(?<=\d)\.(?=\d)", " נקודה ", t)
              for ch in ("-", "–", "—", "=", "&", ".", "\n", "\r", '"', "'", "`", "<", ">", "*", "#", "%", "(", ")"):
                  t = t.replace(ch, " ")
              t = re.sub(r"\s+", " ", t).strip()
              if len(t) > n:
                  cut = t[:n]
                  t = cut[:cut.rfind(" ")] if " " in cut[n // 2:] else cut
              return (t or "אין תשובה")

          def yemot_download(path):
              if not path.startswith("ivr2:"):
                  path = "ivr2:" + path
              r = requests.get("https://www.call2all.co.il/ym/api/DownloadFile",
                               params={"token": YEMOT_TOKEN, "path": path}, timeout=20)
              r.raise_for_status()
              return r.content

          @app.route("/yemot", methods=["GET", "POST"])
          def yemot():
              p = request.values
              print("YEMOT-REQ:", dict(p), flush=True)
              _ctx.caller = p.get("ApiPhone", "") or p.get("ApiDID", "")
              call_id = p.get("ApiCallId", "anon")

              if p.get("hangup") or p.get("ApiHangup"):
                  SESSIONS.pop(call_id, None)
                  return Response("", mimetype="text/plain")

              now = time.time()
              for k in [k for k, v in SESSIONS.items() if now - v.get("t", now) > 3600]:
                  SESSIONS.pop(k, None)

              st = SESSIONS.setdefault(call_id, {"hist": [], "cache": {}, "answers": [], "nav_idx": -1})
              st["t"] = now

              rec_keys = sorted([k for k in p.keys() if k.startswith("rec") and k[3:].isdigit()],
                                key=lambda k: int(k[3:]))
              nxt = (int(rec_keys[-1][3:]) + 1) if rec_keys else 0

              # בדיקת מקש שנלחץ (למשל בעת האזנה או דפדוף)
              digits = p.get(f"digits_{nxt-1}", "") or p.get("digits", "")

              # טיפול בניווט (מקשים 8 ו-2)
              if digits in ["8", "2"]:
                  if not st["answers"]:
                      msg = "אין עדיין תשובות קודמות בשיחה זו"
                  else:
                      if st["nav_idx"] == -1:
                          st["nav_idx"] = len(st["answers"]) - 1

                      if digits == "8":  # שאלה/תשובה קודמת
                          if st["nav_idx"] > 0:
                              st["nav_idx"] -= 1
                          msg = f"תשובה קודמת: {st['answers'][st['nav_idx']]}"
                      elif digits == "2":  # שאלה/תשובה הבאה
                          if st["nav_idx"] < len(st["answers"]) - 1:
                              st["nav_idx"] += 1
                          msg = f"תשובה הבאה: {st['answers'][st['nav_idx']]}"

                  resp = f"read=t-{esc(msg)}=digits_{nxt},tap,1,1,1,1,no,2,8,*=rec{nxt},,record,,,no"
                  return Response(resp, mimetype="text/plain")

              # אם הוקש כוכבית או שהמשתמש יצא מדפדוף
              if digits == "*":
                  st["nav_idx"] = -1
                  resp = f"read=t-הקלט כעת=rec{nxt},,record,,,no"
                  return Response(resp, mimetype="text/plain")

              # ברכת פתיחה נקייה בשיחה חדשה
              if not rec_keys:
                  greet = "שלום הגעתם לעוזר החכם דברו ולסיום הקישו סולמית"
                  resp = f"read=t-{esc(greet, 1500)}=rec0,,record,,,no"
                  return Response(resp, mimetype="text/plain")

              newest = rec_keys[-1]
              try:
                  if p.get(newest, "") in st["cache"]:
                      reply = st["cache"][p.get(newest, "")]
                  else:
                      audio = yemot_download(p.get(newest, ""))
                      reply = converse(st["hist"], audio)
                      st["cache"][p.get(newest, "")] = reply
                      st["answers"].append(reply)
                      st["nav_idx"] = -1

                      def _bg_process(aud, rep, caller_phone):
                          transcript = gemini_transcribe(aud)
                          _save_turn_to_github(caller_phone, transcript, rep)
                      threading.Thread(target=_bg_process, args=(audio, reply, _ctx.caller), daemon=True).start()

              except Exception as e:
                  print("YEMOT-ERR:", _safe(repr(e)), flush=True)
                  return Response(f"read=t-סליחה לא שמעתי טוב נסו שוב=rec{nxt},,record,,,no",
                                  mimetype="text/plain")

              # תמיכה בעצירה בכוכבית ודפדוף ב-2 ו-8 תוך כדי/לאחר התשובה
              resp = f"read=t-{esc(reply)}=digits_{nxt},tap,1,1,1,1,no,2,8,*=rec{nxt},,record,,,no"
              print("YEMOT-RESP:", resp[:120], flush=True)
              return Response(resp, mimetype="text/plain")

          @app.route("/yemot/health")
          def health():
              return {"ok": True, "model": GEMINI_MODEL}

          if __name__ == "__main__":
              app.run(host="127.0.0.1", port=5000)
          EOF

      - name: Run Server and Tunnel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YEMOT_TOKEN: ${{ secrets.YEMOT_TOKEN }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 server.py &
          sleep 2
          cloudflared tunnel --url http://127.0.0.1:5000 --no-autoupdate > tunnel.log 2>&1 &
          
          echo "ממתין לקבלת כתובת השרת..."
          FOUND=0
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=========================================================="
              echo "השרת מוכן לפעולה!"
              echo "הכתובת היא: $URL/yemot"
              echo "מעדכן את שלוחה 2 בימות המשיח..."
              
              CONFIG_DATA="type=api"$'\n'"api_link=$URL/yemot"$'\n'"api_wait_answer_music_on_hold=yes"
              
              UPDATE_RES=$(curl -s -X POST "https://www.call2all.co.il/ym/api/UploadTextFile" \
                -d "token=$YEMOT_TOKEN" \
                -d "what=ivr2:2/ext.ini" \
                --data-urlencode "contents=$CONFIG_DATA")
              
              echo "תגובת עדכון ימות המשיח: $UPDATE_RES"
              echo "=========================================================="
              FOUND=1
              break
            fi
            sleep 1
          done

          if [ $FOUND -eq 0 ]; then
            echo "שגיאה: לא התקבלה כתובת ממנהרת Cloudflare."
            cat tunnel.log
            exit 1
          fi

          wait -n
