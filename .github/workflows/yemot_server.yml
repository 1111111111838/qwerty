name: Yemot AI Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flask requests google-genai
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Server Script
        run: |
          cat << 'EOF' > server.py
          import os
          import re
          import time
          import requests
          from flask import Flask, request, Response
          from google import genai
          from google.genai import types

          app = Flask(__name__)

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          YEMOT_TOKEN    = os.environ.get("YEMOT_TOKEN", "")

          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.5-flash",
              "gemini-flash-lite-latest",
              "gemini-3.6-flash"
          ]

          client = genai.Client(api_key=GEMINI_API_KEY) if GEMINI_API_KEY else None

          def download_yemot_recording(path):
              if not YEMOT_TOKEN:
                  print("YEMOT_TOKEN is missing!", flush=True)
                  return None
              if not path.startswith("ivr2:"):
                  path = "ivr2:" + path
              url = "https://www.call2all.co.il/ym/api/DownloadFile"
              try:
                  res = requests.get(url, params={"token": YEMOT_TOKEN, "path": path}, timeout=30)
                  res.raise_for_status()
                  return res.content
              except Exception as e:
                  print(f"שגיאה בהורדת הקלטה {path}: {e}", flush=True)
                  return None

          def ask_gemini_audio(audio_bytes):
              if not client:
                  return "מפתח הגישה לבינה המלאכותית אינו מוגדר."

              last_error = ""
              for model_name in MODELS:
                  try:
                      print(f"מנסה פנייה למודל: {model_name}", flush=True)
                      response = client.models.generate_content(
                          model=model_name,
                          contents=[
                              types.Part.from_bytes(
                                  data=audio_bytes,
                                  mime_type="audio/wav",
                              ),
                              "הקשב לשאלת המשתמש וענה עליה בקצרה ובאופן ברור להשמעה קולית בטלפון ללא שום עיצוב טקסט."
                          ]
                      )
                      if response.text:
                          return response.text.strip()
                  except Exception as e:
                      last_error = str(e)
                      print(f"שגיאה במודל {model_name}: {e}. ממשיך למודל הבא...", flush=True)
                      time.sleep(0.2)
                      continue

              print(f"כל הניסיונות ברשימת המודלים נכשלו: {last_error}", flush=True)
              return "המערכת עמוסה כעת, אנא נסה שוב בעוד מספר רגעים."

          def clean_for_yemot(txt):
              txt = re.sub(r'[\r\n\t]+', ' ', txt)
              txt = txt.replace('"', "''").replace('&', ' ו')
              txt = re.sub(r'[^\w\s.,?!:;\'-]', '', txt)
              return txt.strip()

          def find_latest_recording(req_values):
              all_wavs = []
              for key in req_values:
                  if key.startswith('rec') or key in ['file', 'recording']:
                      vals = req_values.getlist(key)
                      for v in vals:
                          if v and str(v).endswith('.wav'):
                              all_wavs.append(v)
              if all_wavs:
                  return all_wavs[-1], len(all_wavs)
              return None, 0

          @app.route('/yemot', methods=['GET', 'POST'])
          def yemot():
              val = request.values
              print("REQUEST ARGS:", dict(val), flush=True)

              recording_path, count = find_latest_recording(val)
              nxt_idx = count + 1

              if not recording_path:
                  msg = "שלום, אנא אמור את שאלתך לאחר הצליל."
                  response_text = f"read=t-{msg}=rec{nxt_idx},,record,,,no"
                  return Response(response_text, mimetype="text/plain; charset=utf-8")

              audio_data = download_yemot_recording(recording_path)
              if not audio_data:
                  reply = "לא הצלחתי לקבל את קובץ ההקלטה, אנא נסה שוב."
              else:
                  reply = ask_gemini_audio(audio_data)

              cleaned = clean_for_yemot(reply)
              response_text = f"read=t-{cleaned}=rec{nxt_idx},,record,,,no"
              return Response(response_text, mimetype="text/plain; charset=utf-8")

          @app.route('/health', methods=['GET'])
          def health():
              return {"status": "ok", "models": MODELS}

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          EOF

      - name: Run Server and Tunnel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YEMOT_TOKEN: ${{ secrets.YEMOT_TOKEN }}
        run: |
          python3 server.py &
          sleep 2
          cloudflared tunnel --url http://127.0.0.1:5000 --no-autoupdate > tunnel.log 2>&1 &
          
          echo "ממתין לקבלת כתובת השרת..."
          FOUND=0
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=========================================================="
              echo "השרת מוכן לפעולה!"
              echo "הכתובת עבור api_link בימות המשיח היא:"
              echo "$URL/yemot"
              echo "=========================================================="
              FOUND=1
              break
            fi
            sleep 1
          done

          if [ $FOUND -eq 0 ]; then
            echo "שגיאה: לא התקבלה כתובת ממנהרת Cloudflare."
            cat tunnel.log
            exit 1
          fi

          wait -n
