name: Yemot AI Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flask requests ddgs
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Create Server Script
        run: |
          cat << 'EOF' > server.py
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os, re, ast, math, json, time, base64, operator, datetime, requests, threading, subprocess, smtplib
          from email.message import EmailMessage
          from urllib.parse import quote
          from flask import Flask, request, Response, send_from_directory

          GEMINI_KEY    = os.environ.get("GEMINI_API_KEY", "")
          GEMINI_MODEL  = os.environ.get("GEMINI_MODEL", "gemini-3.8-flash")
          YEMOT_TOKEN   = os.environ.get("YEMOT_TOKEN", "")
          GMAIL_USER    = os.environ.get("GMAIL_USER", "")
          GMAIL_PASS    = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          OWNER_EMAIL   = os.environ.get("OWNER_EMAIL", GMAIL_USER)
          DOMAIN        = os.environ.get("PUBLIC_DOMAIN", "https://grafi-art.duckdns.org")

          SYSTEM_PROMPT = (
              "אתה פועל לפי השקפת עולם חרדית-אורתודוקסית בשפה מכובדת ונקייה, בטון רגוע ומכבד. "
              "אינך פותח בהצהרות על זהותך. "
              "אינך עוסק ברכילות, אישים ידוענים, תרבות פופולרית חילונית, מוזיקה או סרטים חילוניים, "
              "דתות אחרות, זרמים אחרים ביהדות, או נושאי צניעות ורבייה. "
              "יש בורא אחד לעולם שבראו בששת ימי בראשית. "
              "בלימוד תורה מותר להביא אך ורק מקורות מתוך: תנ\"ך, תלמוד בבלי, תלמוד ירושלמי, שולחן ערוך ורמב\"ם, כסיוע לדברי המשתמש. אין לפסוק הלכה למעשה (יש להפנות לרב מוסמך). "
              "בענייני רפואה דבר בריחוק ללא פירוט איברים פנימיים או פריון והפנה לרופא. "
              "ענה תמיד באופן קצר, ענייני, ללא מקפים (כתוב 'כ 20' במקום 'כ-20'), ללא כוכביות, ללא אחוזים וללא סימני פיסוק מיוחדים."
          )

          FALLBACKS = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-lite-latest", "gemini-3.6-flash"]
          MODELS = [GEMINI_MODEL] + [m for m in FALLBACKS if m != GEMINI_MODEL]

          def _safe(e):
              return re.sub(r"(key|token)=[^&\s'\")]+", r"\1=***", str(e))

          UA = {"User-Agent": "Mozilla/5.0 (YemotAI)"}
          app = Flask(__name__)
          SESSIONS = {}
          _ctx = threading.local()

          def tool_web_search(query, max_results=3):
              try:
                  from ddgs import DDGS
                  rows = list(DDGS().text(query, region="il-he", max_results=max_results))[:max_results]
                  if not rows:
                      return "לא נמצאו תוצאות"
                  return "\n".join(f"{r.get('title')} - {(r.get('body') or '')[:140]}" for r in rows)
              except Exception as e:
                  return f"שגיאת חיפוש: {e}"

          def _send_mail(subject, body, attach=None, to=None):
              import mimetypes
              msg = EmailMessage()
              msg["Subject"] = subject or "הודעה מהעוזר הקולי"
              msg["From"] = GMAIL_USER
              msg["To"] = to or OWNER_EMAIL
              msg.set_content(body or "")
              if attach and os.path.exists(attach) and os.path.getsize(attach) <= 23 * 1024 * 1024:
                  ctype = mimetypes.guess_type(attach)[0] or "application/octet-stream"
                  maintype, subtype = ctype.split("/", 1)
                  with open(attach, "rb") as f:
                      msg.add_attachment(f.read(), maintype=maintype, subtype=subtype,
                                         filename=os.path.basename(attach))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=90) as smtp:
                  smtp.login(GMAIL_USER, GMAIL_PASS)
                  smtp.send_message(msg)

          def tool_send_email(subject, body, to=""):
              try:
                  addr = _resolve_email(to) or OWNER_EMAIL
                  _send_mail(subject, body, to=addr)
                  return f"המייל נשלח בהצלחה אל {addr}"
              except Exception as e:
                  return f"שליחת המייל נכשלה: {e}"

          _OPS = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,
                  ast.Div: operator.truediv, ast.Pow: operator.pow, ast.Mod: operator.mod,
                  ast.FloorDiv: operator.floordiv, ast.USub: operator.neg, ast.UAdd: operator.pos}
          _FUNCS = {"sqrt": math.sqrt, "abs": abs, "round": round, "floor": math.floor, "ceil": math.ceil,
                    "min": min, "max": max}

          def _ev(n):
              if isinstance(n, ast.Constant) and isinstance(n.value, (int, float)): return n.value
              if isinstance(n, ast.BinOp):
                  l, r = _ev(n.left), _ev(n.right)
                  return _OPS[type(n.op)](l, r)
              if isinstance(n, ast.UnaryOp): return _OPS[type(n.op)](_ev(n.operand))
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id in _FUNCS:
                  args = [_ev(a) for a in n.args]
                  return _FUNCS[n.func.id](*args)
              raise ValueError("bad")

          def tool_calculate(expr):
              try:
                  t = str(expr or "").lower().replace("x", "*").replace(":", "/")
                  v = _ev(ast.parse(t, mode="eval").body)
                  if isinstance(v, float) and v.is_integer(): v = int(v)
                  return f"התוצאה היא {v}"
              except Exception:
                  return "לא הצלחתי לחשב את הביטוי"

          def tool_weather(city):
              try:
                  g = requests.get("https://geocoding-api.open-meteo.com/v1/search",
                                   params={"name": city, "count": 1, "language": "he"}, timeout=8).json()
                  res = g.get("results")
                  if not res: return "לא מצאתי את המיקום"
                  lat, lon = res[0]["latitude"], res[0]["longitude"]
                  nm = res[0].get("name", city)
                  w = requests.get("https://api.open-meteo.com/v1/forecast",
                                   params={"latitude": lat, "longitude": lon,
                                           "current": "temperature_2m",
                                           "daily": "temperature_2m_max,temperature_2m_min",
                                           "timezone": "auto"}, timeout=8).json()
                  cur = w.get("current", {}); daily = w.get("daily", {})
                  t = cur.get("temperature_2m")
                  hi = (daily.get("temperature_2m_max") or [None])[0]
                  lo = (daily.get("temperature_2m_min") or [None])[0]
                  return f"מזג האוויר ב{nm}: כעת {t} מעלות, מקסימום היום {hi}, מינימום {lo}"
              except Exception as e:
                  return f"שגיאת מזג אוויר: {e}"

          CITY_GEO = {"ירושלים": 281184, "תל אביב": 293397, "חיפה": 294801, "באר שבע": 295530,
                      "בני ברק": 293918, "מודיעין": 281184, "בית שמש": 281184, "אשדוד": 295629}

          def _hm(v): return v[11:16] if isinstance(v, str) and len(v) >= 16 else "-"

          def tool_zmanim(city="ירושלים"):
              try:
                  geo = CITY_GEO.get((city or "").strip(), 281184)
                  d = requests.get("https://www.hebcal.com/zmanim",
                                   params={"cfg": "json", "geonameid": geo}, timeout=8).json()
                  t = d.get("times", {})
                  return f"זמנים ל{city}: הנץ החמה {_hm(t.get('sunrise'))}, סוף זמן שמע {_hm(t.get('sofZmanShma'))}, חצות {_hm(t.get('chatzot'))}, שקיעה {_hm(t.get('sunset'))}"
              except Exception as e:
                  return f"שגיאת זמנים: {e}"

          def tool_hebrew_date():
              try:
                  today = datetime.date.today()
                  c = requests.get("https://www.hebcal.com/converter",
                                   params={"cfg": "json", "gy": today.year, "gm": today.month,
                                           "gd": today.day, "g2h": 1, "lg": "h"}, timeout=8).json()
                  return "היום " + c.get("hebrew", "")
              except Exception as e:
                  return f"שגיאת תאריך עברי: {e}"

          def tool_shabbat(city="ירושלים"):
              try:
                  city = (city or "ירושלים").strip()
                  d = requests.get("https://www.hebcal.com/shabbat",
                                   params={"cfg": "json", "geonameid": CITY_GEO.get(city, 281184), "lg": "h", "M": "on"}, timeout=8).json()
                  out = []
                  for it in d.get("items", []):
                      if it.get("category") in ("candles", "havdalah", "parashat"):
                          tm = re.search(r"\d{1,2}:\d{2}", it.get("title", ""))
                          out.append((it.get("hebrew") or it.get("title", "")) + ((" " + tm.group(0)) if tm else ""))
                  return f"שבת ב{city}: " + ", ".join(out)
              except Exception as e:
                  return f"שגיאת נתוני שבת: {e}"

          def tool_now():
              try:
                  from zoneinfo import ZoneInfo
                  n = datetime.datetime.now(ZoneInfo("Asia/Jerusalem"))
              except Exception:
                  n = datetime.datetime.now()
              days = ["שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת", "ראשון"]
              return "היום יום %s השעה %02d:%02d" % (days[n.weekday()], n.hour, n.minute)

          def dispatch(name, a):
              try:
                  if name == "web_search":   return tool_web_search(a.get("query", ""))
                  if name == "calculate":    return tool_calculate(a.get("expression", ""))
                  if name == "weather":      return tool_weather(a.get("city", "ירושלים"))
                  if name == "zmanim":       return tool_zmanim(a.get("city", "ירושלים"))
                  if name == "shabbat":      return tool_shabbat(a.get("city", "ירושלים"))
                  if name == "hebrew_date":  return tool_hebrew_date()
                  if name == "now":          return tool_now()
              except Exception as e:
                  return f"שגיאה בכלי {name}: {e}"
              return "פעולה בוצעה"

          def _p(props, required=None):
              return {"type": "object", "properties": props, "required": required or []}

          TOOLS = [{"function_declarations": [
              {"name": "web_search", "description": "חיפוש מידע עדכני", "parameters": _p({"query": {"type": "string"}}, ["query"])},
              {"name": "calculate", "description": "חישוב חשבוני מדויק", "parameters": _p({"expression": {"type": "string"}}, ["expression"])},
              {"name": "weather", "description": "מזג אוויר בעיר", "parameters": _p({"city": {"type": "string"}}, ["city"])},
              {"name": "zmanim", "description": "זמני היום בהלכה", "parameters": _p({"city": {"type": "string"}})},
              {"name": "shabbat", "description": "כניסת ויציאת שבת", "parameters": _p({"city": {"type": "string"}})},
              {"name": "hebrew_date", "description": "תאריך עברי", "parameters": _p({})},
              {"name": "now", "description": "שעה נוכחית בישראל", "parameters": _p({})},
          ]}]

          def gemini_call(contents, use_tools=True):
              payload = {
                  "contents": contents,
                  "system_instruction": {"parts": [{"text": SYSTEM_PROMPT + " " + tool_now()}]}
              }
              if use_tools:
                  payload["tools"] = TOOLS

              last = None
              for m in MODELS:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={GEMINI_KEY}"
                  try:
                      r = requests.post(url, json=payload, timeout=12)
                      if r.status_code in (429, 500, 503):
                          continue
                      r.raise_for_status()
                      return r.json()
                  except Exception as e:
                      last = f"{m}: {_safe(repr(e))}"
                      continue
              raise RuntimeError(f"gemini failed: {last}")

          def converse(history, audio_bytes):
              contents = list(history)
              contents.append({"role": "user", "parts": [
                  {"inline_data": {"mime_type": "audio/wav", "data": base64.b64encode(audio_bytes).decode()}},
                  {"text": "ענה על שאלת המתקשר בקצרה, בבהירות, וללא שום מקפים או קיצורים."}
              ]})
              for i in range(3):
                  data = gemini_call(contents, use_tools=(i < 2))
                  cand = data.get("candidates", [{}])[0].get("content", {})
                  parts = cand.get("parts", [])
                  fcs = [p["functionCall"] for p in parts if "functionCall" in p]
                  if fcs:
                      contents.append(cand)
                      fr = []
                      for fc in fcs:
                          res = dispatch(fc.get("name", ""), fc.get("args", {}) or {})
                          fr.append({"functionResponse": {"name": fc.get("name"), "response": {"result": res}}})
                      contents.append({"role": "user", "parts": fr})
                      continue
                  txt = "".join(p.get("text", "") for p in parts).strip()
                  history.append({"role": "user", "parts": [{"text": "[שאלה קולית]"}]})
                  history.append({"role": "model", "parts": [{"text": txt or "בוצע"}]})
                  if len(history) > 8:
                      del history[:len(history) - 8]
                  return txt or "הפעולה בוצעה"
              return "סליחה, לא הצלחתי לקבל מענה."

          def esc(t, n=850):
              t = re.sub(r'(^|\s)כ-(\d+)', r'\1כ \2', t)
              t = re.sub(r'(^|\s)מ-(\d+)', r'\1מ \2', t)
              t = re.sub(r'(^|\s)ב-(\d+)', r'\1ב \2', t)
              t = re.sub(r'(^|\s)ל-(\d+)', r'\1ל \2', t)
              t = re.sub(r"(?<=\d)\.(?=\d)", " נקודה ", t)
              for ch in ("-", "–", "—", "=", "&", ".", "\n", "\r", '"', "'", "`", "<", ">", "*", "#", "%", "(", ")"):
                  t = t.replace(ch, " ")
              t = re.sub(r"\s+", " ", t).strip()
              if len(t) > n:
                  cut = t[:n]
                  t = cut[:cut.rfind(" ")] if " " in cut[n // 2:] else cut
              return (t or "אין תשובה")

          def yemot_download(path):
              if not path.startswith("ivr2:"):
                  path = "ivr2:" + path
              r = requests.get("https://www.call2all.co.il/ym/api/DownloadFile",
                               params={"token": YEMOT_TOKEN, "path": path}, timeout=20)
              r.raise_for_status()
              return r.content

          @app.route("/yemot", methods=["GET", "POST"])
          def yemot():
              p = request.values
              print("YEMOT-REQ:", dict(p), flush=True)
              call_id = p.get("ApiCallId", "anon")
              if p.get("hangup") or p.get("ApiHangup"):
                  SESSIONS.pop(call_id, None)
                  return Response("", mimetype="text/plain")
              now = time.time()
              for k in [k for k, v in SESSIONS.items() if now - v.get("t", now) > 3600]:
                  SESSIONS.pop(k, None)
              st = SESSIONS.setdefault(call_id, {"hist": [], "cache": {}})
              st["t"] = now
              rec_keys = sorted([k for k in p.keys() if k.startswith("rec") and k[3:].isdigit()],
                                key=lambda k: int(k[3:]))
              if not rec_keys:
                  greet = "שלום, הגעתם לעוזר החכם, דברו ולסיום הקישו סולמית"
                  return Response(f"read=t-{esc(greet, 1500)}=rec0,,record,,,no", mimetype="text/plain")
              newest, nxt = rec_keys[-1], int(rec_keys[-1][3:]) + 1
              try:
                  if p.get(newest, "") in st["cache"]:
                      reply = st["cache"][p.get(newest, "")]
                  else:
                      audio = yemot_download(p.get(newest, ""))
                      reply = converse(st["hist"], audio)
                      st["cache"][p.get(newest, "")] = reply
              except Exception as e:
                  print("YEMOT-ERR:", _safe(repr(e)), flush=True)
                  return Response(f"read=t-סליחה לא שמעתי טוב נסו שוב=rec{nxt},,record,,,no",
                                  mimetype="text/plain")
              resp = f"read=t-{esc(reply)}=rec{nxt},,record,,,no"
              print("YEMOT-RESP:", resp[:120], flush=True)
              return Response(resp, mimetype="text/plain")

          @app.route("/yemot/health")
          def health():
              return {"ok": True, "model": GEMINI_MODEL}

          if __name__ == "__main__":
              app.run(host="127.0.0.1", port=5000)
          EOF

      - name: Run Server and Tunnel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YEMOT_TOKEN: ${{ secrets.YEMOT_TOKEN }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python3 server.py &
          sleep 2
          cloudflared tunnel --url http://127.0.0.1:5000 --no-autoupdate > tunnel.log 2>&1 &
          
          echo "ממתין לקבלת כתובת השרת..."
          FOUND=0
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=========================================================="
              echo "השרת מוכן לפעולה!"
              echo "הכתובת עבור api_link בימות המשיח היא:"
              echo "$URL/yemot"
              echo "=========================================================="
              FOUND=1
              break
            fi
            sleep 1
          done

          if [ $FOUND -eq 0 ]; then
            echo "שגיאה: לא התקבלה כתובת ממנהרת Cloudflare."
            cat tunnel.log
            exit 1
          fi

          wait -n
