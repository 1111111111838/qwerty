name: Advanced Remote Desktop Session (KDE - 6 Hours)

on:
  workflow_dispatch:
    inputs:
      crd_auth_code:
        description: 'Google Headless CRD Auth Command'
        required: true
      crd_pin:
        description: '6-digit PIN for CRD'
        required: true
        default: '123456'

jobs:
  start-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install Advanced Desktop Environment (KDE Plasma) & Tools
        run: |
          sudo apt update
          
          # התקנת שולחן עבודה KDE וכלי עזר בסיסיים
          sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes \
            kde-plasma-desktop dbus-x11 xserver-xorg-video-dummy \
            dolphin konsole kate kcalc ark

          # התקנת Google Chrome
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt install -f -y

          # התקנת Chrome Remote Desktop
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt install -f -y

          # הגדרת סשן הפעלה של KDE עבור CRD
          echo "export DESKTOP_SESSION=plasma" > ~/.chrome-remote-desktop-session
          echo "exec startplasma-x11" >> ~/.chrome-remote-desktop-session

      - name: Register and Start Chrome Remote Desktop
        run: |
          ${{ github.event.inputs.crd_auth_code }} --pin=${{ github.event.inputs.crd_pin }}

      - name: Keep Alive for 6 Hours
        run: |
          echo "KDE Plasma Desktop running. Active for 6 hours..."
          # 21600 שניות = 6 שעות
          sleep 21600
          echo "Session finished."
