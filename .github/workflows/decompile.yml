name: Remote Desktop Session

on:
  workflow_dispatch:
    inputs:
      crd_auth_code:
        description: 'Command line string from Google Headless (starts with DISPLAY=...)'
        required: true
      crd_pin:
        description: '6-digit PIN for CRD'
        required: true
        default: '123456'

jobs:
  start-desktop:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Desktop Environment & Chrome Remote Desktop
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes \
            xfce4 xfce4-goodies dbus-x11 xserver-xorg-video-dummy \
            firefox thunar mousepad

          # Download and install Google Chrome Remote Desktop
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt install -f -y

          # Configure XFCE session for the runner user
          echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > ~/.chrome-remote-desktop-session

      - name: Register and Start Chrome Remote Desktop
        run: |
          # Inject the PIN automatically into the auth command
          ${{ github.event.inputs.crd_auth_code }} --pin=${{ github.event.inputs.crd_pin }}

      - name: Keep Alive for 20 Minutes
        run: |
          echo "Session started successfully. Staying active for 20 minutes..."
          sleep 1200
          echo "Session time completed."
