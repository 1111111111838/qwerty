name: פירוק סטודיו Q8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Extract
        run: |
          rm -rf "א/פירוק"
          mkdir -p "א/פירוק"
          7z x "א/סטודיו Q8.exe" -o"א/פירוק" -y || true
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "א/פירוק"
          git diff --cached --quiet || (git commit -m "Extract Studio Q8" && git push)
