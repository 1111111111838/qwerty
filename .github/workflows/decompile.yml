name: Advanced Remote Desktop Session (KDE - 6 Hours)

on:
  workflow_dispatch:
    inputs:
      crd_auth_code:
        description: 'Google Headless CRD Auth Command'
        required: true
      crd_pin:
        description: '6-digit PIN for CRD'
        required: true
        default: '123456'

jobs:
  start-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Advanced Desktop Environment (KDE Plasma) & Tools
        run: |
          sudo apt update
          
          # התקנת שולחן עבודה KDE, גופנים וכלי מערכת
          sudo DEBIAN_FRONTEND=noninteractive apt install --assume-yes \
            kde-plasma-desktop dbus-x11 xserver-xorg-video-dummy \
            dolphin konsole kate kcalc ark fonts-dejavu-core fonts-noto-core

          # התקנת Google Chrome
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt install -f -y

          # התקנת Chrome Remote Desktop
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt install -f -y

          # הגדרת סשן הפעלה של KDE עבור CRD
          echo "export DESKTOP_SESSION=plasma" > ~/.chrome-remote-desktop-session
          echo "exec startplasma-x11" >> ~/.chrome-remote-desktop-session

      - name: Configure User Password, Screen Locker & Hebrew Keyboard
        run: |
          # הגדרת סיסמה למשתמש runner
          echo "runner:123456" | sudo chpasswd

          # ביטול נעילת מסך אוטומטית
          mkdir -p ~/.config
          cat << 'EOF' > ~/.config/kscreenlockerrc
          [Daemon]
          Autolock=false
          LockOnResume=false
          Timeout=0
          EOF

          # הגדרת מקלדת עברית + אנגלית עם החלפה ב-Alt+Shift
          sudo localectl set-x11-keymap us,il pc105 "" grp:alt_shift_toggle

      - name: Restore Chrome Profile from Repository
        run: |
          if [ -f "$GITHUB_WORKSPACE/chrome_profile.tar.gz" ]; then
            echo "פרופיל כרום נמצא במאגר, משחזר נתונים..."
            mkdir -p ~/.config/google-chrome
            tar -xzf "$GITHUB_WORKSPACE/chrome_profile.tar.gz" -C ~/.config/google-chrome
            echo "השחזור הושלם בהצלחה."
          else
            echo "לא נמצא גיבוי קודם של כרום, ייווצר פרופיל נקי."
          fi

      - name: Register and Start Chrome Remote Desktop
        run: |
          RUN_TIME=$(TZ="Asia/Jerusalem" date +"%H-%M")
          CUSTOM_NAME="GitHub-Server-$RUN_TIME"
          sudo hostnamectl set-hostname "$CUSTOM_NAME"

          CMD=$(echo "${{ github.event.inputs.crd_auth_code }}" | sed -E "s/--name=[^ ]+/--name=$CUSTOM_NAME/")
          eval "$CMD --pin=${{ github.event.inputs.crd_pin }}"

      - name: Keep Alive for 6 Hours
        run: |
          echo "KDE Plasma Desktop running. Active for 6 hours..."
          sleep 21600
          echo "Session finished."

      - name: Save Chrome Profile to Repository
        if: always()
        run: |
          pkill -f chrome || true
          sleep 3

          if [ -d "$HOME/.config/google-chrome" ]; then
            echo "מכווץ את תיקיית הפרופיל של כרום..."
            tar --exclude='Default/Cache' \
                --exclude='Default/Code Cache' \
                --exclude='Default/GPUCache' \
                --exclude='GrShaderCache' \
                --exclude='ShaderCache' \
                -czf "$GITHUB_WORKSPACE/chrome_profile.tar.gz" -C "$HOME/.config/google-chrome" .

            cd "$GITHUB_WORKSPACE"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add chrome_profile.tar.gz
            git diff --staged --quiet || (git commit -m "Auto-save Chrome profile [skip ci]" && git push)
            echo "נתוני כרום נשמרו בהצלחה למאגר."
          fi
