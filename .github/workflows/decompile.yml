name: פירוק סטודיו Q8

on:
  workflow_dispatch:
  push:
    paths:
      - 'א/סטודיו Q8.exe'
      - '.github/workflows/decompile.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyInstaller extractor
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstxtractor-ng

      - name: Extract PyInstaller executable
        run: |
          rm -rf "א/פירוק"
          mkdir -p "א/פירוק"
          pyinstxtractor-ng --one-dir "א/סטודיו Q8.exe"
          echo "=== Looking for extractor output ==="
          find . -maxdepth 3 -type d -name '*_extracted' -print
          EXTRACTED="$(find . -maxdepth 3 -type d -name '*_extracted' -print -quit)"
          if [ -n "$EXTRACTED" ] && [ -d "$EXTRACTED" ]; then
            echo "Using extracted directory: $EXTRACTED"
            cp -a "$EXTRACTED"/. "א/פירוק"/
            rm -rf "$EXTRACTED"
          else
            echo "Extractor did not create an extracted directory."
            exit 1
          fi

      - name: Show extracted files
        run: |
          echo "=== Extracted files ==="
          find "א/פירוק" -type f | sort | head -500
          echo "=== File count ==="
          find "א/פירוק" -type f | wc -l

      - name: Save extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "א/פירוק"
          git diff --cached --quiet || (git commit -m "Extract Studio Q8 with PyInstaller extractor" && git push)
