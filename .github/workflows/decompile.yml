name: Remote Desktop with Filtering

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'הדבק כאן את קוד ה-CRD מ-remotedesktop.google.com/headless'
        required: true
      pin:
        description: 'קוד PIN בן 6 ספרות'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: הגדרת סינון רשת ונעילת DNS
        run: |
          # 1. ניתוב ל-DNS מסנן (Cloudflare Family)
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 1.1.1.3" | sudo tee /etc/resolv.conf
          echo "nameserver 1.0.0.3" | sudo tee -a /etc/resolv.conf

          # 2. מניעת עריכה של קובץ ההגדרות (נעילת קובץ)
          sudo chattr +i /etc/resolv.conf

          # 3. חסימת כל בקשות DNS לשרתים אחרים (פורט 53 ו-853)
          sudo iptables -A OUTPUT -p udp --dport 53 -d 1.1.1.3 -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 53 -d 1.1.1.3 -j ACCEPT
          sudo iptables -A OUTPUT -p udp --dport 53 -d 1.0.0.3 -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 53 -d 1.0.0.3 -j ACCEPT
          sudo iptables -A OUTPUT -p udp --dport 53 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 53 -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 853 -j DROP

      - name: התקנת סביבת שולחן עבודה ו-Chrome Remote Desktop
        run: |
          sudo apt-get update --fix-missing
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies dbus-x11 xvfb
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./chrome-remote-desktop_current_amd64.deb
          rm -f chrome-remote-desktop_current_amd64.deb

      - name: הגדרת סשן שולחן עבודה
        run: |
          mkdir -p ~/.config/chrome-remote-desktop
          echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > ~/.chrome-remote-desktop-session

      - name: הפעלת שרת הגישה המרוחקת
        run: |
          /opt/google/chrome-remote-desktop/start-host \
            --code="${{ github.event.inputs.crd_code }}" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="GitHub-Runner" \
            --user-name="$USER" \
            --host-type=single-process \
            --pin="${{ github.event.inputs.pin }}"
          
          # שמירה על הריצה פעילה
          sleep 21600
